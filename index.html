<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BearSec Threat Intel Center</title>

  <!-- Favicon ของหน้า Wrapper นี้ทำงานได้ปกติ (ไม่ใช่ข้อจำกัดแบบ Apps Script) เพราะเป็นหน้า Static ธรรมดา -->
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43b.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f172a; color: #f1f5f9; font-family: -apple-system, 'Segoe UI', sans-serif; z-index: 10; gap: 12px;
    }
    #loading .icon { font-size: 40px; }
    #loading .spinner {
      width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.25); border-top: 3px solid #6366f1;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="icon">🐻</div>
    <div class="spinner"></div>
    <div>กำลังโหลด BearSec Threat Intel Center...</div>
  </div>

  <!--
    🔧 ต้องแก้ตรงนี้จุดเดียว: เปลี่ยน src ด้านล่างเป็น URL /exec จริงของคุณ
    ⚠️ สำคัญ: ใช้ URL จาก "Manage deployments > แก้ไข Deployment เดิม (ไอคอนดินสอ) > New version"
    เท่านั้น อย่าใช้ "New deployment" เพราะจะได้ URL ใหม่ทุกครั้งและทำให้หน้านี้เชื่อมไม่ติดอีกต่อไป
    การแก้ไข Deployment เดิมแบบ New Version จะคง URL เดิมไว้เสมอ ถึงจะอัปเดตโค้ดกี่ครั้งก็ตาม
  -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbyQ0H_oniO3xfiXz2NgwXMcXBDpcGDFRfqlCa-DSgNHQtTkUMqL-tnBCK-VrBn1i9mcEg/exec"
    title="BearSec Threat Intel Center"
    onload="document.getElementById('loading').style.display='none'"
    allow="clipboard-write">
  </iframe>
</body>
</html>
